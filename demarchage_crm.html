// Load saved statuses & notes from localStorage
function getSavedState() {
    const saved = localStorage.getItem('smartresto_crm_state');
    return saved ? JSON.parse(saved) : {};
}

function saveState(id, status, note) {
    const state = getSavedState();
    if (!state[id]) state[id] = {};
    if (status !== undefined) state[id].status = status;
    if (note !== undefined) state[id].note = note;
    localStorage.setItem('smartresto_crm_state', JSON.stringify(state));
    updateStats();
}

function updateStats() {
    const state = getSavedState();
    let envoyes = 0, rdv = 0, signes = 0;
    
    PROSPECTS.forEach(p => {
        const s = (state[p.id] && state[p.id].status) || 'a_contacter';
        if (s === 'envoye') envoyes++;
        if (s === 'rdv') rdv++;
        if (s === 'signe') signes++;
    });

    document.getElementById('stat-envoyes').innerText = envoyes;
    document.getElementById('stat-rdv').innerText = rdv;
    document.getElementById('stat-signes').innerText = signes;
    const contacted = envoyes + rdv + signes;
    const rate = contacted > 0 ? Math.round(((rdv + signes) / contacted) * 100) : 0;
    document.getElementById('stat-taux').innerText = rate + '%';
}

function copyToClipboard(text, btnElement) {
    navigator.clipboard.writeText(text).then(() => {
        const originalText = btnElement.innerHTML;
        btnElement.innerHTML = '<i class="fa fa-check text-success"></i> Copié !';
        setTimeout(() => { btnElement.innerHTML = originalText; }, 2000);
    });
}

function renderProspects() {
    const container = document.getElementById('prospectsContainer');
    const state = getSavedState();
    const query = document.getElementById('searchInput').value.toLowerCase();
    const quartierVal = document.getElementById('quartierFilter').value.toLowerCase();
    const statusVal = document.getElementById('statusFilter').value;

    let html = '';
    let countVisible = 0;

    PROSPECTS.forEach(p => {
        const currentStatus = (state[p.id] && state[p.id].status) || 'a_contacter';
        const currentNote = (state[p.id] && state[p.id].note) || '';

        // Filters
        if (query && !p.nom.toLowerCase().includes(query) && !p.adresse.toLowerCase().includes(query) && !p.type.toLowerCase().includes(query)) {
            return;
        }
        if (quartierVal && !p.quartier.toLowerCase().includes(quartierVal) && !p.ville.toLowerCase().includes(quartierVal)) {
            return;
        }
        if (statusVal && currentStatus !== statusVal) {
            return;
        }

        countVisible++;

        const isSaas = p.offre.toLowerCase().includes('saas');
        const badgeOffreClass = isSaas ? 'badge-offre-saas' : 'badge-offre-licence';

        // URL encoded wa text
        const encodedWa = encodeURIComponent(p.custom_pitch);
        const waLink = p.wa_number ? `https://web.whatsapp.com/send?phone=${p.wa_number}&text=${encodedWa}` : '#';
        const hasWa = p.wa_number !== '';

        const encodedSubject = encodeURIComponent(p.email_subject);
        const encodedBody = encodeURIComponent(p.email_body);
        const mailtoLink = `mailto:${p.email}?subject=${encodedSubject}&body=${encodedBody}`;

        html += `
        <div class="prospect-card">
            <div class="row">
                <div class="col-lg-7">
                    <div class="d-flex align-items-center mb-2">
                        <h4 class="fw-bold mb-0 me-2 text-dark">#${p.id} ${p.nom}</h4>
                        <span class="badge ${badgeOffreClass} p-2 me-1">${p.offre}</span>
                        <span class="badge badge-quartier p-2">${p.ville} - ${p.quartier}</span>
                    </div>
                    <p class="text-muted small mb-2"><i class="fa fa-map-marker-alt text-danger me-1"></i> ${p.adresse}</p>
                    <p class="mb-2"><span class="badge bg-light text-dark border">${p.type}</span></p>
                    <div class="alert alert-light border py-2 px-3 small mb-3 text-secondary">
                        <strong><i class="fa fa-lightbulb text-warning me-1"></i> Argument clé :</strong> ${p.argument}
                    </div>
                    <div class="d-flex flex-wrap gap-2 align-items-center">
                        <span class="small text-muted"><i class="fa fa-phone me-1"></i> ${p.telephone}</span>
                        ${p.email ? `<span class="small text-muted ms-3"><i class="fa fa-envelope me-1"></i> ${p.email}</span>` : ''}
                    </div>
                </div>
                <div class="col-lg-5 mt-3 mt-lg-0 border-start-lg ps-lg-4 d-flex flex-column justify-content-between">
                    <div>
                        <div class="mb-3">
                            <label class="form-label small fw-bold text-uppercase mb-1 text-muted">Statut Démarchage :</label>
                            <select class="form-select form-select-sm fw-bold" onchange="saveState(${p.id}, this.value, undefined)">
                                <option value="a_contacter" ${currentStatus === 'a_contacter' ? 'selected' : ''}>⚪ À contacter</option>
                                <option value="envoye" ${currentStatus === 'envoye' ? 'selected' : ''}>🟡 Message / Email envoyé</option>
                                <option value="rdv" ${currentStatus === 'rdv' ? 'selected' : ''}>🟢 RDV Démo Programmé</option>
                                <option value="signe" ${currentStatus === 'signe' ? 'selected' : ''}>💎 Client Signé 🎉</option>
                                <option value="non" ${currentStatus === 'non' ? 'selected' : ''}>🔴 Pas intéressé</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <input type="text" class="form-control form-control-sm" placeholder="Note rapide (ex: Rappeler mardi 11h)..." value="${currentNote}" onchange="saveState(${p.id}, undefined, this.value)">
                        </div>
                    </div>
                    <div class="d-flex flex-wrap gap-2">
                        ${hasWa ? `
                            <a href="${waLink}" target="_blank" class="btn btn-wa btn-sm flex-fill text-center py-2" onclick="saveState(${p.id}, 'envoye', undefined)">
                                <i class="fab fa-whatsapp me-1"></i> Contacter sur WhatsApp
                            </a>
                        ` : `
                            <button class="btn btn-secondary btn-sm flex-fill" disabled title="Pas de mobile WhatsApp direct renseigné">
                                <i class="fab fa-whatsapp me-1"></i> Pas de WhatsApp
                            </button>
                        `}
                        <button class="btn btn-copy btn-sm" onclick="copyToClipboard(\`${p.custom_pitch.replace(/`/g, '\\`')}\`, this)" title="Copier le pitch personnalisé">
                            <i class="fa fa-copy"></i> Copier
                        </button>
                        ${p.email ? `
                            <a href="${mailtoLink}" class="btn btn-outline-primary btn-sm" onclick="saveState(${p.id}, 'envoye', undefined)" title="Envoyer un email personnalisé">
                                <i class="fa fa-envelope"></i> Email
                            </a>
                        ` : ''}
                    </div>
                </div>
            </div>
        </div>
        `;
    });

    if (countVisible === 0) {
        html = '<div class="alert alert-info text-center py-5">Aucun prospect ne correspond à vos filtres de recherche.</div>';
    }

    container.innerHTML = html;
}

function exportData() {
    const state = getSavedState();
    let csvContent = 'id,nom,ville,quartier,telephone,email,statut,note\n';
    PROSPECTS.forEach(p => {
        const s = (state[p.id] && state[p.id].status) || 'a_contacter';
        const n = (state[p.id] && state[p.id].note) || '';
        csvContent += `"${p.id}","${p.nom}","${p.ville}","${p.quartier}","${p.telephone}","${p.email}","${s}","${n.replace(/"/g, '""')}"\n`;
    });
    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'suivi_demarchage_smartresto_mali.csv';
    a.click();
}

document.getElementById('searchInput').addEventListener('input', renderProspects);
document.getElementById('quartierFilter').addEventListener('change', renderProspects);
document.getElementById('statusFilter').addEventListener('change', renderProspects);

// Initial Render
renderProspects();
updateStats();
</script>
